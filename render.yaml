services:
  - type: web
    name: cassandra-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_URL
        sync: false
      - key: SUPER_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

  - type: web
    runtime: static
    name: cassandra-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Valori pubblici (finiscono nel bundle JS): definiti qui così il Blueprint
    # è autosufficiente e non dipende da frontend/.env.production (gitignorato).
    envVars:
      - key: VITE_API_URL
        value: https://cassandra-rdy2.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        value: 807179757624-b8scdn196tuil986t8rl72ljcc6kqhqt.apps.googleusercontent.com
    # SPA: ogni rotta sconosciuta serve index.html (Vue Router lato client)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
